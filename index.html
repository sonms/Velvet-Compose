<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet-Compose</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }
        h1 { font-size: 2.5rem; color: #a78bfa; }
        p { color: #aaa; font-size: 1rem; }
        .cards {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: #16213e;
            border: 1px solid #a78bfa33;
            border-radius: 16px;
            padding: 32px;
            width: 220px;
            text-align: center;
            text-decoration: none;
            color: #eee;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #a78bfa;
        }
        .card .icon { font-size: 3rem; margin-bottom: 12px; }
        .card .name { font-size: 1.2rem; font-weight: bold; color: #a78bfa; }
        .card .desc { font-size: 0.85rem; color: #aaa; margin-top: 8px; }
        .badge {
            display: inline-block;
            background: #a78bfa22;
            color: #a78bfa;
            border-radius: 99px;
            padding: 2px 10px;
            font-size: 0.75rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div style="text-align:center">
    <h1>🎡 Velvet-Compose</h1>
    <p>Smooth & beautiful Jetpack Compose components</p>
</div>

<div class="cards">
    <a class="card" href="./wheelpicker/">
        <div class="icon">🎡</div>
        <div class="name">WheelPicker</div>
        <div class="desc">iOS-style 3D wheel picker with infinite scroll</div>
        <div class="badge">v0.0.1</div>
    </a>
    <a class="card" href="./ratingbar/">
        <div class="icon">⭐</div>
        <div class="name">RatingBar</div>
        <div class="desc">Customizable rating bar with spring animation</div>
        <div class="badge">v0.0.1</div>
    </a>
</div>

<p style="font-size:0.8rem; color:#555">
    © 2026 sonms · Apache License 2.0
</p>
</body>
</html>
