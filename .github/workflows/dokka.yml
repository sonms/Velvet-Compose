name: Deploy Dokka to GitHub Pages

on:
  push:
    branches: [ master ]

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Dokka HTML - WheelPicker
        run: ./gradlew :wheelpicker:dokkaGeneratePublicationHtml --no-configuration-cache

      - name: Generate Dokka HTML - RatingBar
        run: ./gradlew :ratingbar:dokkaGeneratePublicationHtml --no-configuration-cache

      # :modifier-node-processor is internal machinery with no consumer-facing API — not documented.
      - name: Generate Dokka HTML - Modifier Node Annotations
        run: ./gradlew :modifier-node-annotations:dokkaGeneratePublicationHtml --no-configuration-cache

      - name: Deploy Root Index
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          target-folder: .
          clean: false

      - name: Deploy WheelPicker Docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: wheelpicker/build/dokka/html
          target-folder: wheelpicker
          clean: false

      - name: Deploy RatingBar Docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ratingbar/build/dokka/html
          target-folder: ratingbar
          clean: false

      - name: Deploy Modifier Node Annotations Docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: modifier-node-annotations/build/dokka/html
          target-folder: modifier-node-annotations
          clean: false